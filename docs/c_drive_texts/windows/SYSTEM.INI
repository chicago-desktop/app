; SYSTEM.INI - what once decided how the machine came up.
;
; On this system none of it is true any more, and that is the interesting
; part: there are no drivers here, there is a runtime. What boots is a set
; of modules resolved by version tags; what draws is a compositor; what
; talks to the terminal is one process and only one.

[boot]
shell=chicago.shell:shell
system.drv=wippy.runtime
display.drv=terminal.gfx
mouse.drv=sgr1006.drv
keyboard.drv=xterm.drv
sound.drv=(none)
comm.drv=ssh.drv
network.drv=wippy.gateway

[boot.description]
system.drv=Wippy runtime (fork wippy-projects)
display.drv=Terminal graphics, cells and pixels
mouse.drv=SGR 1006 mouse, one-based coordinates
keyboard.drv=Standard terminal keyboard
network.drv=HTTP gateway on 127.0.0.1:8099

[386Enh]
; There is no 386 here and there never was. The lines are kept because the
; section is the one everybody remembers editing.
EMMExclude=A000-FFFF
device=*vshare
device=*dynapage
MinTimeSlice=20
WindowUpdateTime=50
PagingDrive=
MaxPhysPage=

[terminal]
Host=chicago.shell:terminal
HideLogs=1
; A log line written to the terminal scrambles the frame for good: the
; surface differ believes it is the only writer there. This is the one line
; in this file that describes something real.

[ssh]
Host=app.desktop:ssh
Port=2222
MaxSessions=16
CloseGrace=10s
; Every connection is a desktop of its own, sized by the client's terminal.

[drivers]
timer=wippy.time
wave=(none)
midi=(none)
; Sound is not missing by accident. A terminal has no wave device, and a
; beep pretending to be TADA.WAV would be a joke told once.

[keyboard]
subtype=
type=4
keyboard.dll=
oemansi.bin=
