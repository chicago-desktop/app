; WIN.INI - the settings, in the shape they had.
;
; Nothing reads this file. The desktop keeps its wallpaper, its pattern and
; its layout in a database table, one row per person, and its programs in
; the registry. A second copy of the settings that nobody keeps in step
; would be worse than none: it would be believed.

[windows]
load=
run=
NullPort=None
device=
DosPrint=no
Programs=lua yaml md
Documents=txt md log csv json
DeviceNotSelectedTimeout=15
TransmissionRetryTimeout=45
CoolSwitch=1
ScreenSaveActive=0
ScreenSaveTimeOut=600

[Desktop]
Wallpaper=(None)
TileWallpaper=0
WallpaperStyle=0
Pattern=(None)
GridGranularity=0
IconSpacing=75
IconTitleWrap=1

[Chicago]
Shell=chicago.shell:shell
Base=chicago.tui_desktop
Draw=pixels
Text=cells
Fonts=chicago.shell.theme:fonts
Kerning=0

[Terminal]
Graphics=ask
CellSize=ask
Mouse=1006
Colours=256

[Ports]
LPT1:=
COM1:=9600,n,8,1,x
COM2:=2400,n,8,1,x

[fonts]
Liberation Sans (OFL)=LIBSANS.TTF
Liberation Sans Bold (OFL)=LIBSANSB.TTF
Liberation Mono (OFL)=LIBMONO.TTF

[Extensions]
txt=notepad.exe ^.txt
ini=notepad.exe ^.ini
log=notepad.exe ^.log
png=picture.exe ^.png
lua=notepad.exe ^.lua

[Compatibility]
; Kept empty on purpose. In the original this section was where the system
; admitted, program by program, that it had to lie about itself to keep
; something working.
