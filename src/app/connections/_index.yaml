version: "1.0"
namespace: app.connections

# Connections settings in the Windows 95 shell: "Start → Settings →
# Connections". A connection is a kickside platform concept (a component whose
# meta.class is "connection", created from a provider's contract.binding with a
# credential_schema), so the window lives in the stand, like the chat window,
# and not in the shell module.
#
# The window does exactly what the HTTP handlers of kickside/connection do,
# without HTTP: list through the kickside.connection:connections contract,
# providers from registry.find over contract.binding entries, create through
# the component service with the same create_policy validation, rename through
# component.set_meta, delete through the connections contract, test through the
# connection contract's test_connection.
#
# Rights are not granted to the window on purpose, the same way as for the
# chat: the shell spawns it under the actor of the logged-in user, and the
# group app.security:user already carries what the web UI uses. Under the
# service actor (a shell without logon) the window names the refusal in its
# status bar. The only policy here is for talking to the COMPOSITOR.

entries:
  # app.connections:window_scope
  - name: window_scope
    kind: security.policy
    meta:
      comment: Rights of the Connections window to talk to the compositor — the process context, the compositor's name in the process registry and sending it frame state.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # app.connections:model
  - name: model
    kind: library.lua
    meta:
      comment: Pure translation between platform shapes (component rows, contract.binding entries, credential schemas) and the window (table rows, form tree, private_context); no IO, so a test runs it on stubs.
    source: file://model.lua
    imports:
      conn_types: kickside.connection:types
      create_policy: kickside.connection.api:create_policy

  # app.connections:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Connections
      image: dialup
      icon: "⇄"
      group: Settings
      order: 50
      width: 78
      height: 22
      window_type: app
      resizable: true
      pixel_render: windows.shell.sdk:render
      pixel_state: app.connections:window
      comment: Connections of the platform — list, create from a provider's credential form, rename, test and delete; every refusal is shown in the status bar.
    source: file://window.lua
    method: main
    modules:
      - contract
      - registry
      - security
      - time
    imports:
      app: windows.shell.sdk:app
      ui: windows.shell.sdk:ui
      model: app.connections:model
      component: kickside.component:component
      conn_types: kickside.connection:types
      create_policy: kickside.connection.api:create_policy
    security:
      policies: [app.connections:window_scope]

  # app.connections:model_test
  #
  # Run from the stand with `wippy test --host wippy.terminal:host`. That boots
  # the whole application (background services included), so do it only when the
  # stand may run; the same suite also runs in an isolated harness (see the
  # report of task C1).
  - name: model_test
    kind: function.lua
    meta:
      type: test
      comment: Connections model — rows and state projection, provider discovery from bindings, the credential form tree, form → private_context and the required-field check, refusal text by error kind.
      group: Connections
      suite: app_connections
    source: file://model_test.lua
    imports:
      test: wippy.test:test
      model: app.connections:model
      conn_types: kickside.connection:types
    method: run
