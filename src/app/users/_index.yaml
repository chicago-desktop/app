version: "1.0"
namespace: app.users

# Users in the Windows 95 shell: "Start → Settings → Users", the Windows NT
# User Manager over kickside/users. The window does what the module's HTTP
# handlers do, without HTTP, through the same libraries: user_repo and
# user_groups_repo to list, admin_repo to create and update, group_validation
# and the security_scopes contract for groups, the lifecycle report to delete.
#
# Rights come from the logged-in user's group, and the window adds none of its
# own for the data. It checks the handlers' gates itself —
# security.can("access", kickside.users.api:<handler>.endpoint) — because
# app.security:user also carries db.get on app:db: without the gates the window
# would be a way around the handlers' authorization. A button the account may
# not use is disabled and the reason is on screen.
#
# The window refuses what the handlers would let through: deleting or
# deactivating the signed-in account, and taking the administrator group away
# from its last holder.

entries:
  # app.users:window_scope
  - name: window_scope
    kind: security.policy
    meta:
      comment: Rights of the Users window to talk to the compositor — the process context, the compositor's name in the process registry and sending it frame state.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # app.users:sessions
  - name: sessions
    kind: library.lua
    meta:
      comment: The newest session token's expiry per account from kickside_user_auth_tokens (the payload's actor_id and the expiry only, never the token) and its wording; shared by Users and User Profile.
    source: file://sessions.lua
    modules:
      - sql

  # app.users:model
  - name: model
    kind: library.lua
    meta:
      comment: Pure translation between the users module's shapes (accounts with groups, the scope catalog, token expiries) and the window (rows, forms, refusals); no IO, so a test runs it on stubs.
    source: file://model.lua
    imports:
      consts: kickside.users:consts
      format: app.common:format
      sessions: app.users:sessions

  # app.users:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Users
      image: user
      icon: "☺"
      group: Settings
      order: 60
      width: 92
      height: 24
      window_type: app
      resizable: true
      pixel_render: windows.shell.sdk:render
      pixel_state: app.users:window
      comment: The application's accounts — list, create, rename, change status, reset a password, set groups and delete, through the users module's own libraries and gates; the last administrator and the signed-in account are protected.
    source: file://window.lua
    method: main
    modules:
      - contract
      - security
      - time
    imports:
      app: windows.shell.sdk:app
      ui: windows.shell.sdk:ui
      model: app.users:model
      sessions: app.users:sessions
      consts: kickside.users:consts
      user_repo: kickside.users.persist:user_repo
      user_groups_repo: kickside.users.persist:user_groups_repo
      admin_repo: kickside.users.persist:admin_repo
      group_validation: kickside.users.api:group_validation
      lifecycle_report: kickside.core.lifecycle:report
    security:
      policies: [app.users:window_scope]

  # app.users:model_test
  #
  # Run from the stand with `wippy test --host wippy.terminal:host`. That boots
  # the whole application, so do it only when the stand may run; the same suite
  # runs in an isolated harness (see the report of task S4).
  - name: model_test
    kind: function.lua
    meta:
      type: test
      comment: Users model — accounts joined with groups and newest token, token wording, the signed-in and last-administrator refusals, gates on the list sheet, the new-account and Properties checks, group saving.
      group: Users
      suite: app_users
    source: file://model_test.lua
    imports:
      test: wippy.test:test
      model: app.users:model
    method: run
