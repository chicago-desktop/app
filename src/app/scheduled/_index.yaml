version: "1.0"
namespace: app.scheduled

# Scheduled Tasks in the Windows 95 shell: "Start → Settings → Scheduled
# Tasks". The schedules are kickside/cron's (bridge jobs, content beats and
# anything else that called kickside.cron:scheduler.create), so the window
# lives in the stand, like Connections, and not in the shell module.
#
# The window does what the HTTP handlers of kickside/cron do, without HTTP:
# list and delete through the kickside.cron:scheduler contract opened with the
# caller's actor and scope (list_schedules.lua, delete_schedule.lua), and the
# contract's own get and update for Properties and Pause/Resume. Run Now opens
# kickside.cron:schedulable on the row's implementation, the way the worker
# does (worker.lua execute_task), under the caller's identity.
#
# The scheduler lists only the caller's own rows (list_schedules_func filters
# by actor id), so the window shows the tasks of the logged-in user.
#
# Rights are not granted to the window on purpose, the same way as for
# Connections: the shell spawns it under the actor of the logged-in user, and
# the group app.security:user already carries the contract rights the web UI
# uses. Under the service actor (a shell without logon) the window names the
# refusal in its status bar. The only policy here is for talking to the
# COMPOSITOR.

entries:
  # app.scheduled:window_scope
  - name: window_scope
    kind: security.policy
    meta:
      comment: Rights of the Scheduled Tasks window to talk to the compositor — the process context, the compositor's name in the process registry and sending it frame state.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # app.scheduled:model
  - name: model
    kind: library.lua
    meta:
      comment: Pure translation between kickside/cron's shapes (schedule rows, get answers) and the window (table rows, properties, request bodies); no IO, so a test runs it on stubs.
    source: file://model.lua
    imports:
      format: app.common:format

  # app.scheduled:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Scheduled Tasks
      image: clock
      icon: "◷"
      group: Settings
      order: 55
      width: 92
      height: 22
      window_type: app
      resizable: true
      pixel_render: chicago.shell.sdk:render
      pixel_state: app.scheduled:window
      comment: The scheduler's tasks under your account — next and last run, status, Run Now, Pause/Resume, Delete and Properties; every refusal is shown in the status bar.
    source: file://window.lua
    method: main
    modules:
      - contract
      - registry
      - security
      - time
    imports:
      app: chicago.shell.sdk:app
      ui: chicago.shell.sdk:ui
      model: app.scheduled:model
      format: app.common:format
    security:
      policies: [app.scheduled:window_scope]

  # app.scheduled:model_test
  #
  # Run from the stand with `wippy test --host wippy.terminal:host`. That boots
  # the whole application (background services included), so do it only when the
  # stand may run; the same suite also runs in an isolated harness (see the
  # report of task S1).
  - name: model_test
    kind: function.lua
    meta:
      type: test
      comment: Scheduled Tasks model — schedule wording, row projection and order, status, request bodies, execute's answers, properties.
      group: Scheduled Tasks
      suite: app_scheduled
    source: file://model_test.lua
    imports:
      test: wippy.test:test
      model: app.scheduled:model
    method: run
