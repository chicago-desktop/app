version: "1.0"
namespace: app.deps

# The modules this application composes. Every entry is an `ns.dependency`:
# `wippy update` resolves them into wippy.lock, and a declared dependency
# missing from the lock stops the boot outright. The Chicago shell's
# "Add/Remove Programs" edits this file (app.desktop:deps_source) — a change
# takes effect after `wippy update` and a restart.

entries:
  # app.deps:kickside
  #
  # The platform is a module too, and it has to be declared. Without this
  # declaration any resolve from the sources throws it out of the lock together
  # with everything reachable only through it (users, agents, models, sessions,
  # mcp-client, connection, component, core, security, ui, sso, sync, hub,
  # inbox, dashboard, realtime, facade, usage), and the boot fails on
  # kickside.agents:ui_static.
  - version: '>=v0.0.0'
    name: kickside
    kind: ns.dependency
    meta: {}
    component: kickside/kickside
    # Bind the control plane explicitly from the host application.
    parameters:
      - name: keeper:admin_scope
        value: app.security:admin

  # app.deps:mcp
  #
  # The platform's MCP server: the ChicagoWorkshop tool (app.workshop) is
  # reached over it.
  - version: '>=v0.0.0'
    name: mcp
    kind: ns.dependency
    meta: {}
    component: kickside/mcp
    parameters:
      - name: kickside.mcp:api_router
        value: app:api
      - name: kickside.mcp:public_router
        value: app:api.public
      - name: kickside.mcp:target_db
        value: app:db
      - name: kickside.mcp:ui_server
        value: app:gateway
      - name: kickside.mcp.security:user_security_scope
        value: app.security:user

  # app.deps:tui-desktop
  #
  # The window desktop in the terminal. It brings ITS OWN terminal.host — it
  # needs hide_logs — and from then on the CLI's terminal host autodetection
  # refuses to choose: it counts terminal.host entries, and there are two now.
  # So every command needs an explicit --host, including other modules':
  #   wippy run --host chicago.tui_desktop:terminal desktop
  #   wippy test --host wippy.terminal:host
  - version: '>=0.2.0'
    name: tui-desktop
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/tui-desktop
    parameters:
      - name: chicago.tui_desktop:api_router
        value: app:api
      - name: chicago.tui_desktop.security:user_security_scope
        value: app.security:user

  # app.deps:windows
  #
  # The second shell of the same desktop — the Chicago look. It carries no
  # window mechanics of its own: it calls the compositor library from
  # chicago/tui-desktop with its own theme. It brings a THIRD terminal.host, so
  # --host is required here too:
  #   wippy run --host chicago.shell:terminal chicago
  # The SSH host (app.desktop:ssh) opens this module's `shell` entry. The
  # logon takes the display-name rule from chicago.shell.sdk:format, which
  # came in 0.2.4; the startup windows and the SDK picture the Welcome module
  # stands on came in 0.2.5. Shell 0.3.0 provides the menu and inline-picture
  # APIs used by the independent Display module below.
  - version: '>=0.3.2'
    name: windows
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/shell
    parameters:
      - name: chicago.shell:api_router
        value: app:api
      - name: chicago.shell:target_db
        value: app:db
      - name: chicago.shell.security:user_security_scope
        value: app.security:user

  # app.deps:minesweeper
  #
  # Minesweeper for the shell: the rules as a pure library, the window a
  # declarative SDK application. No requirements to bind.
  - version: '>=0.2.0'
    name: minesweeper
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/minesweeper

  # app.deps:weather
  #
  # Weather for the shell: the window, the temperature in the tray and the
  # desktop widget. The forecaster service keeps the chosen city in the
  # application's database and runs on its process host.
  - version: '>=0.2.0'
    name: weather
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/weather
    parameters:
      - name: chicago.weather:target_db
        value: app:db
      - name: chicago.weather:process_host
        value: app:processes
  # app.deps:aicq
  #
  # aICQ — people and agents in one ICQ-style contact list. The parameters
  # follow the module's requirements: the database for contacts and messages,
  # the process host for the presence and messenger services.
  - version: '>=0.2.1'
    name: aicq
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/aicq
    parameters:
      - name: chicago.aicq:target_db
        value: app:db
      - name: chicago.aicq:process_host
        value: app:processes

  # app.deps:calculator
  #
  # The Chicago Calculator, a module of its own since shell 0.1.1.
  - version: '>=0.2.0'
    name: calculator
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/calculator

  # app.deps:network
  #
  # Network Neighborhood: the runtime's cluster as computers on a network; it
  # stands on the desktop. A module of its own since shell 0.1.1.
  - version: '>=0.2.0'
    name: network
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/network

  # app.deps:antibug
  #
  # AntiBug, the test scanner (administrators only). This application declares
  # no scan targets of its own: "This computer" runs the application's tests.
  - version: '>=0.2.0'
    name: antibug
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/antibug
    parameters:
      - name: chicago.antibug:process_host
        value: app:processes

  # app.deps:appwiz
  #
  # Add/Remove Programs (administrators only): edits this file through the
  # folder CHICAGO_DEPS_FS names (app.desktop:deps_source, .wippy.yaml).
  - version: '>=0.2.0'
    name: appwiz
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/appwiz

  # app.deps:regedit
  #
  # The Registry Editor (administrators only, read-only), a module of its own
  # since shell 0.1.2.
  - version: '>=0.2.0'
    name: regedit
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/regedit

  # app.deps:datetime
  #
  # Date/Time, opened by the taskbar clock (app.desktop:taskbar_clock names it).
  - version: '>=0.2.0'
    name: datetime
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/datetime

  # app.deps:taskman
  #
  # Task Manager (administrators only) and the runtime monitor widgets on the
  # desktop (Memory, Goroutines), which open it; the widgets came in 0.2.1.
  - version: '>=0.2.1'
    name: taskman
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/taskman

  # app.deps:run
  #
  # Run…, at the root of the Start menu.
  - version: '>=0.2.0'
    name: run
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/run

  # app.deps:users
  #
  # Users and User Profile (Start → Settings). CHICAGO_PROFILE_ENTRY in
  # .wippy.yaml names chicago.users:profile for the user row of the Start menu.
  - version: '>=0.2.0'
    name: users
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/users

  # app.deps:services
  #
  # Services (Start → Settings), the runtime's supervised services, read-only.
  - version: '>=0.2.0'
    name: services
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/services

  # app.deps:scheduled
  #
  # Scheduled Tasks (Start → Settings), the tasks kickside/cron runs.
  - version: '>=0.2.0'
    name: scheduled
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/scheduled

  # app.deps:events
  #
  # Event Viewer (Start → Settings), the platform's component events.
  - version: '>=0.2.0'
    name: events
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/events

  # app.deps:connections
  #
  # Connections (Start → Settings), the platform's connections.
  - version: '>=0.2.0'
    name: connections
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/connections

  # app.deps:welcome
  #
  # Welcome — the "Did you know..." window after logon (a startup window of
  # the shell), with tips any module registers as `meta.type: chicago.tip`
  # (app.desktop:ssh_keys_tip is the application's own). It keeps whether to
  # show itself and the last tip per person in the application's database.
  - version: '>=0.2.2'
    name: welcome
    kind: ns.dependency
    meta: {}
    component: github.com/chicago-desktop/welcome
    parameters:
      - name: chicago.welcome:target_db
        value: app:db

  # Versioned desktop modules, installed from their GitHub tags.
  - name: floppy
    kind: ns.dependency
    component: github.com/chicago-desktop/floppy
    version: ">=0.1.1"

  - name: workshop
    kind: ns.dependency
    component: github.com/chicago-desktop/workshop
    version: ">=0.1.0"

  # Display owns appearance settings, the desktop Properties menu and Pipes preview.
  - name: display
    kind: ns.dependency
    component: github.com/chicago-desktop/display
    version: ">=0.1.1"
