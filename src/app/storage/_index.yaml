version: "1.0"
namespace: app

# Filesystems the application declares for the modules it composes.

entries:
  # app:system_fonts
  #
  # Fonts for the pixel shell. The name is not ours to choose: windows/shell
  # looks for `app:system_fonts` by default (WINDOWS_FONTS overrides it), and
  # declaring the filesystem is the application's job, not the module's.
  #
  # The directory is the system's and read only; `auto_init` is off on
  # purpose, so the application neither tries to create it nor rearranges its
  # permissions. Debian/Ubuntu: the fonts-liberation package.
  - name: system_fonts
    kind: fs.directory
    meta:
      comment: "System TrueType fonts, read only — gfx needs them for text in pixels."
    auto_init: false
    directory: /usr/share/fonts/truetype/liberation/
