version: "1.0"
namespace: app.monitor

# The runtime monitor on the Windows 95 shell's desktop: two widgets (FR-006,
# the shell module's docs/sdk.md, "Desktop widgets") — the heap and the
# goroutines, a sample every 2 s, two minutes of history. They read the
# runtime the same way Task Manager does (`chicago.shell.config:system`) and
# open it on a click. They have no network, no database and no files.
#
# The shell reads the widget entries at start and on `desktop.refresh`: a new
# entry appears on the desktop after the shell restarts.

entries:
  # app.monitor:sample
  - name: sample
    kind: library.lua
    meta:
      comment: "A ring of 60 samples, a round ceiling, one sample of a runtime figure and the trees of both widgets; a refusal is a label, not a zero."
    source: file://sample.lua
    imports:
      facts: chicago.shell.config:system
      charts: chicago.shell.sdk:charts
      gadget: chicago.shell.sdk:gadget

  # app.monitor:widget_scope
  #
  # `system.read` — the runtime's figures; the rest is the conversation with
  # the compositor: find it by the name from the process context and publish
  # the tree. Nothing more: a widget starts nothing and stops no one.
  - name: widget_scope
    kind: security.policy
    meta:
      comment: "The monitor widgets — read the runtime's figures and publish a tree to the compositor; start nothing."
    policy:
      actions:
        - system.read
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # app.monitor:memory
  #
  # The `system` module is deliberately not declared here: the `facts`
  # library declares it, and the `system.read` right is this entry's policy.
  - name: memory
    kind: process.lua
    meta:
      type: chicago.widget
      title: Memory
      width: 20
      height: 8
      order: 20
      opens: chicago.taskman:window
      comment: "Widget — the runtime's heap now and over two minutes; a click opens Task Manager."
    source: file://memory.lua
    method: main
    imports:
      app: chicago.shell.sdk:app
      sample: app.monitor:sample
    security:
      policies: [app.monitor:widget_scope]

  # app.monitor:goroutines
  - name: goroutines
    kind: process.lua
    meta:
      type: chicago.widget
      title: Goroutines
      width: 20
      height: 9
      order: 30
      opens: chicago.taskman:window
      comment: "Widget — the runtime's goroutine count now and over two minutes; a click opens Task Manager."
    source: file://goroutines.lua
    method: main
    imports:
      app: chicago.shell.sdk:app
      sample: app.monitor:sample
    security:
      policies: [app.monitor:widget_scope]

  # app.monitor:sample_test
  #
  # Run with `wippy test --host wippy.terminal:host`, and that brings the
  # whole application up — so only when it may come up; the same suite runs
  # in an isolated harness (the report of task W3).
  - name: sample_test
    kind: function.lua
    meta:
      type: test
      comment: "The monitor widgets — the ring keeps 60 samples, the heap in whole megabytes from heap_in_use, a refusal is a label with the reason rather than a zero, the trees lay out inside the panel body without overlaps."
      group: Monitor
      suite: app_monitor
    source: file://sample_test.lua
    imports:
      test: wippy.test:test
      sample: app.monitor:sample
      ui: chicago.shell.sdk:ui
      gadget: chicago.shell.sdk:gadget
    method: run
